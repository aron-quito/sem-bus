name: BusConectado
options:
  bundleIdPrefix: pe.edu.unjbg
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_NAME: "Bus Conectado"
    DEVELOPMENT_TEAM: "84P9Z76M99"
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_CFBundleDisplayName: "Bus Conectado"
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_NSCameraUsageDescription: "Bus Conectado requiere acceso a la cámara para escanear el QR del bus o de validación SUNEDU."
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Bus Conectado utiliza tu ubicación para mostrarte los paraderos cercanos y el arribo del bus en tiempo real."
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  BusConectado:
    type: application
    platform: iOS
    sources:
      - path: BusConectado
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.edu.unjbg.busconectado
        GENERATE_INFOPLIST_FILE: true

